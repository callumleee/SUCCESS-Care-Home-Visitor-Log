spring.application.name=visitorlog

# Local development: in-memory H2 database in PostgreSQL mode.
# Production settings are in application-prod.properties.
spring.datasource.url=jdbc:h2:mem:visitorlog;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.flyway.locations=classpath:db/migration,classpath:db/dev
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true

visitorlog.time-zone=America/Vancouver
visitorlog.seed.admin-username=admin
visitorlog.seed.admin-password=${ADMIN_PASSWORD:dev-admin-password}

# Login tokens (JWT). Secret must be at least 32 characters.
visitorlog.jwt.secret=${JWT_SECRET:dev-only-jwt-secret-change-me-in-production-0123456789}
visitorlog.jwt.expiry-hours=12
# Website allowed to call the API from a browser
visitorlog.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
